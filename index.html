<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liao’s Interactive Worlds</title>
  <style>
    body {
      font-family: "Inter", "Georgia", sans-serif;
      background: #f6f8f7;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      margin: 4rem 1rem 2rem 1rem;
    }
    h1 {
      font-weight: 700;
      font-size: 2rem;
      color: #334;
      margin-bottom: 0.25rem;
    }
    p.subtitle {
      font-size: 1.05rem;
      color: #666;
      margin: 0;
    }
    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0 1rem 4rem 1rem;
    }
    .story-card {
      background: white;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .story-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    .story-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2b4032;
      margin: 0;
    }
    .story-desc {
      color: #666;
      font-size: 0.95rem;
      margin-top: 0.4rem;
      margin-bottom: 0.8rem;
    }
    a.play-btn {
      text-decoration: none;
      background: #98c9a3;
      color: #fff;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 0.4rem;
      transition: background 0.2s;
    }
    a.play-btn:hover {
      background: #7bb385;
    }
    footer {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Interactive Life Stories</h1>
    <p class="subtitle">Gamified journeys for learning, reflection, and growth</p>
  </header>

  <main>
    <div class="story-card">
      <p class="story-title">🌿 Healthy Minimalist</p>
      <p class="story-desc">
        Build discipline, calm, and clarity through daily
 </p>
    <a href="HealthyMinimalist.html" class="play-btn">▶ Play</a>
  </div>
</main>
